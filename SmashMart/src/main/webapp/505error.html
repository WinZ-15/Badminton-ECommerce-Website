<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>505 - HTTP Version Not Supported</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f8f9fa;
      font-family: Arial, sans-serif;
      color: #333;
      text-align: center;
    }

    .container {
      max-width: 600px;
    }

    h1 {
      font-size: 100px;
      color: #e74c3c;
      margin: 0;
    }

    h2 {
      font-size: 28px;
      margin: 10px 0;
    }

    p {
      font-size: 16px;
      margin-bottom: 20px;
      color: #555;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      border: 1px solid #333;
      border-radius: 5px;
      text-decoration: none;
      color: #333;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #333;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>505</h1>
    <h2>HTTP Version Not Supported</h2>
    <p>
      The server does not support the HTTP protocol version used in your request.
      Please try again or contact the website administrator.
    </p>
  </div>
</body>
</html>
